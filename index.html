<html>
  <head>
    <title>Weather App</title>
    <link rel="stylesheet" href="./app.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="page-content">
      <div class="search-city">
        <form action="" class="search-city-form">
          <input type="search" placeholder="Enter city" class="search-input" />
          <button type="submit" class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </div>
      <div class="weather-display-block">
        <div class="weather-now">
          <div class="main-info">
            <p id="location">Hyderabad, Telangana</p>
            <div class="temp_and_img_now">
              <p class="large-font">26</p>
              <img alt="weather icon" class="current-weather-img" />
            </div>
            <p id="feelsLike">Feels like 28 C</p>
          </div>
          <div class="other-info">
            <p id="weather">Cloudy</p>
            <p id="Precip">Precip: 20%</p>
            <p id="humidity">Humidity: 20%</p>
            <p id="windSpeed">Wind Speed: 21 Km/h</p>
            <p id="airQuality">Air Quality: Satisfactory</p>
          </div>
        </div>
        <div class="weather-forcast">
          <ul class="nav nav-underline">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Today</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Tomorrow</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Friday</a>
            </li>
          </ul>
          <div class="weather-data"></div>
        </div>
        <div class="weather-data-credits">
          <span>Powered by</span>
          <a href="https://www.weatherapi.com/" title="Weather API"
            >WeatherAPI.com</a
          >
        </div>
      </div>
    </div>
    <script src="./app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
